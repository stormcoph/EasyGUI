plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")

    // JLayer MP3 decoder (LGPL-2.1, used unmodified - see docs/MP3-LICENSE-NOTES.md).
    // forgeRuntimeLibrary makes it visible to FML's classloader in dev runs; include
    // nests the original Maven Central jar into the released jar via NeoForge JarJar
    // (META-INF/jarjar) so it stays a separate, replaceable artifact as the LGPL requires.
    forgeRuntimeLibrary "javazoom:jlayer:1.0.1"
    include "javazoom:jlayer:1.0.1"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}
