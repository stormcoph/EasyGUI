architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    // Fabric Loader is required here for the @Environment annotations and the
    // transformProductionFabric task. It is not a runtime dependency of common.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_api_version}"

    // JLayer MP3 decoder (LGPL-2.1, used unmodified - see docs/MP3-LICENSE-NOTES.md).
    // Common only compiles against it; the platform modules bundle it jar-in-jar.
    implementation "javazoom:jlayer:1.0.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Headless unit tests: STB TrueType and the stroke geometry are pure CPU, no GL context.
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
        exceptionFormat "full"
    }
}
